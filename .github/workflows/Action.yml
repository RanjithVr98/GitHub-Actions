name: Github Actions
on: 
    push:
        branches:
            - master
jobs:
    build-test-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v7
            - name: install java
              uses: actions/setup-java@v6
              with:
                distribution: temurin
                java-version: '25'
            - name: build stage
              run: mvn clean install -DskipTests=true
            - name: test stage
              run: mvn test
